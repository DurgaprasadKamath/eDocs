{% extends "navbar.html" %} {% block title %} eDocs - Teaching Staff {% endblock
title %} {% block content %}

<div class="upload-office-main">
  <div class="upload-block">
    <form
      action="/office/upload/teaching-staff"
      method="post"
      enctype="multipart/form-data"
    >
      <input type="email" name="email" value="{{email}}" hidden />
      <div class="input-block">
        <p id="label">Document Title</p>
        <input
          type="text"
          id="docTitle"
          name="docTitle"
          placeholder="Title Here"
          required
        />
      </div>
      <div class="input-block">
        <p id="label">Document Category</p>
        <select name="docCategory" id="docCategory" required>
          <option value="ACA_DOC">Academic Documents</option>
          <option value="NOTI">Notice</option>
          <option value="ACA_EVE">Academic Events</option>
          <option value="EXA_TBL">Exam Timetable</option>
          <option value="MEET">Meetings</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="input-block">
        <p id="label">Teaching Staff</p>
        <select name="staffCategory" id="staffCategory" required>
          <option value="all">All</option>
          <option value="hod">HOD</option>
          <option value="faculty">Faculty</option>
        </select>
      </div>
      <div class="input-block">
        <p id="label">Document Description</p>
        <textarea
          name="docDesc"
          rows="3"
          placeholder="Description Here"
          required
        ></textarea>
      </div>
      <div class="input-block">
        <p id="label">Attach Document</p>
        <input type="file" name="docFile" required />
      </div>
      <button type="submit">Upload</button>
    </form>
  </div>
</div>

{% endblock content %}
